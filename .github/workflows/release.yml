name: Release

# Runs on pushing an annotated tag vX.Y.Z; the release title and notes come from the tag message.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notmatch '^v\d') { $v = "v0.0.0-dev" }
          "tag=$v" >> $env:GITHUB_OUTPUT
          "num=$($v.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet run --project tests/AC.Core.Tests -c Release

      # App: one exe, no .NET install needed
      - name: Publish app
        run: >
          dotnet publish src/AC.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.num }} -o out/app

      - name: Pack
        shell: pwsh
        run: |
          Get-ChildItem out/app -Filter *.pdb -Recurse | Remove-Item
          $zip = "AchievementCompanion-${{ steps.ver.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path out/app/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AchievementCompanion-win-x64
          path: ${{ env.ZIP }}

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          # checkout leaves the tag as a commit ref without the message; fetch the annotated tag.
          git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "::error::Use an annotated tag with notes: git tag -a $tag --cleanup=whitespace -F notes.md"
            exit 1
          fi
          echo "title=$(git tag -l --format='%(contents:subject)' "$tag")" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents:body)' "$tag" > notes.md

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: ${{ env.ZIP }}
